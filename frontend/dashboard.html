<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>

  <!-- ============ HEADER (Task 10: sticky/fixed persistent element) ============ -->
  <header class="app-header">
    <div class="brand-mark">
      <span class="dot dot-a"></span><span class="dot dot-b"></span><span class="dot dot-c"></span>
      <span class="brand-name">TaskFlow</span>
    </div>

    <!-- profile entry point -->
    <!-- <a href="profile.html" class="profile-link" aria-label="Go to profile">
      <span class="profile-avatar">A</span>
    </a> -->
    <!-- connect profile -->
     <!-- Profile Button (Pehle se aapke code mein hai) -->
    <a href="profile.html" class="profile-link" aria-label="Go to profile">
      <span class="profile-avatar">A</span>
    </a>
  </header>

  <main class="dashboard">

    <!-- ============ Task 9: heading ============ -->
    <h1 class="page-title">Your projects</h1>

    <!-- ============ Project create form ============
         TODO (you write this): wire submit -> POST /projects on your backend.
         Needs: name input, owner_id (or derive from logged-in user), submit button. -->
    <section class="panel" aria-labelledby="new-project-heading">
      <h2 id="new-project-heading">New project</h2>
      <form id="project-form" novalidate>
        <div class="field">
          <label for="project-name">Project name</label>
          <input type="text" id="project-name" name="project-name" placeholder="e.g. Dark-store restock">
          <p class="field-error" id="project-name-error" role="alert"></p>
        </div>
        <button type="submit" class="btn-primary">Create project</button>
      </form>
    </section>

    <!-- ============ Task 9: add-task form (title input, due-date/priority, submit) ============ -->
    <section class="panel" aria-labelledby="new-task-heading">
      <h2 id="new-task-heading">Add a task</h2>
      <form id="task-form" novalidate>

        <div class="field">
          <label for="task-title">Title</label>
          <input type="text" id="task-title" name="task-title" placeholder="What needs doing?">
          <!-- TODO (Task 13): populate this on empty-title submit, clear it once valid -->
          <p class="field-error" id="task-title-error" role="alert"></p>
        </div>

        <div class="field-row-inline">
          <div class="field">
            <label for="task-due">Due date</label>
            <input type="text" id="task-due" name="task-due" placeholder="e.g. 2026-08-20 or 'next friday'">
          </div>

          <div class="field">
            <label for="task-priority">Priority</label>
            <!-- matches the closed set from the backend: low / medium / high -->
            <select id="task-priority" name="task-priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="task-project">Project</label>
          <!-- TODO (you write this): populate <option>s from GET /projects -->
          <select id="task-project" name="task-project"></select>
        </div>

        <button type="submit" class="btn-primary">Add task</button>
      </form>
    </section>

    <!-- ============ AI quick-add form (Section 3: POST /tasks/quick-add) ============ -->
    <section class="panel panel-accent" aria-labelledby="quick-add-heading">
      <h2 id="quick-add-heading">Quick-add with AI</h2>
      <p class="panel-hint">Describe the task in one sentence — priority and due date are parsed automatically.</p>
      <form id="quick-add-form" novalidate>
        <div class="field">
          <label for="quick-add-input">Description</label>
          <input type="text" id="quick-add-input" name="quick-add-input"
                 placeholder="e.g. Fix the fridge sensor urgent, next monday">
          <p class="field-error" id="quick-add-error" role="alert"></p>
        </div>
        <div class="field">
          <label for="quick-add-project">Project</label>
          <select id="quick-add-project" name="quick-add-project"></select>
        </div>
        <button type="submit" class="btn-primary">Parse &amp; add</button>
      </form>
    </section>

    <!-- ============ Task 9: container that holds the rendered task list ============ -->
    <section class="panel" aria-labelledby="task-list-heading">
      <div class="task-list-head">
        <h2 id="task-list-heading">Tasks</h2>
        <!-- TODO (Section 2): wire these to GET /tasks?sort=priority and /tasks/search -->
        <div class="task-list-controls">
          <input type="search" id="task-search" placeholder="Search by exact title…">
          <select id="task-sort">
            <option value="">Unsorted</option>
            <option value="priority">Sort by priority</option>
          </select>
        </div>
      </div>

      <!-- Task 9/11: this is the container your JS renders into with
           createElement()/appendChild() — leave it empty here. -->
      <div id="task-list" class="task-list" aria-live="polite"></div>

      <!-- shown by JS when task-list has zero children -->
      <p class="empty-state" id="empty-state" hidden>No tasks yet — add one above.</p>
    </section>

  </main>

<!-- <script src="script.js"></script> -->
<script type="module" src="./dashboard.js"></script>
</body>
</html>
