<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Profile & Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="profile.css">
</head>
<body>

  <!-- ============ HEADER ============ -->
  <header class="app-header">
    <div class="brand-mark">
      <span class="dot dot-a"></span><span class="dot dot-b"></span><span class="dot dot-c"></span>
      <span class="brand-name">TaskFlow</span>
    </div>

    <a href="dashboard.html" class="nav-back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Back to Dashboard
    </a>
  </header>

  <main class="profile-container">

    <!-- Profile Header Card -->
    <section class="panel profile-hero">
      <div class="avatar-large" id="avatar-icon">A</div>
      <div class="user-identity">
        <h1 id="display-name">Avinash Raj</h1>
        <p class="user-email" id="display-email">you@example.com</p>
        <span class="badge-role">Pro Account</span>
      </div>
    </section>

    <!-- User Details Form -->
    <section class="panel" aria-labelledby="personal-info-heading">
      <h2 id="personal-info-heading">Personal Information</h2>
      <form id="profile-details-form" novalidate>
        
        <div class="field">
          <label for="full-name">Full Name</label>
          <input type="text" id="full-name" name="full-name" value="Avinash Raj" placeholder="Your name">
        </div>

        <div class="field">
          <label for="user-email">Email Address</label>
          <input type="email" id="user-email" name="user-email" value="you@example.com" placeholder="you@example.com">
        </div>

        <button type="submit" class="btn-primary">Save Changes</button>
        <p class="form-status" id="profile-status" role="status"></p>
      </form>
    </section>

    <!-- Password Management / Reset -->
    <section class="panel" aria-labelledby="security-heading">
      <h2 id="security-heading">Security & Password</h2>
      <form id="password-change-form" novalidate>
        
        <div class="field">
          <label for="current-password">Current Password</label>
          <input type="password" id="current-password" name="current-password" placeholder="••••••••">
        </div>

        <div class="field">
          <label for="new-password">New Password</label>
          <input type="password" id="new-password" name="new-password" placeholder="At least 8 characters">
          <p class="field-hint">Use 8+ characters with a mix of letters and numbers.</p>
        </div>

        <div class="field">
          <label for="confirm-password">Confirm New Password</label>
          <input type="password" id="confirm-password" name="confirm-password" placeholder="••••••••">
        </div>

        <div class="field-row-inline flex-between">
          <button type="submit" class="btn-primary">Update Password</button>
          <a href="forgot-password.html" class="link-accent">Forgot password? Reset via email</a>
        </div>

        <p class="field-error" id="password-error" role="alert"></p>
        <p class="form-status" id="password-status" role="status"></p>
      </form>
    </section>

    <!-- Account Actions -->
    <section class="panel panel-danger" aria-labelledby="danger-zone-heading">
      <h2 id="danger-zone-heading">Account Actions</h2>
      <div class="danger-actions">
        <button id="logout-btn" class="btn-secondary">Log Out</button>
      </div>
    </section>
    <!-- Back Button -->
    <a href="dashboard.html" class="nav-back-link">
      ← Back to Dashboard
    </a>

  </main>

  <script type="module" src="profile.js"></script>
</body>
</html>
